[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseguard"
version = "0.1.0"
description = "Quality-aware rPPG deepfake detection prototype (skin-tone and lighting robust pulse extraction + multimodal fusion)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pulseguard = "pulseguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
